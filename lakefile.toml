name = "zrdt"
version = "0.1.0"
# Test MUST stay in defaultTargets: the #guard_msgs axiom gate in
# Test/Axioms.lean (library Test) only fires when that module is elaborated,
# and a plain `lake build` must run it so drift cannot land silently.
# axiom_check is not a default target: linking it compiles Mathlib's C code
# (about half of a fresh `make install`), and the gate does not need it.
# `make run` re-runs the gate with `lake lean Test/Axioms.lean`.
defaultTargets = ["Crdt", "Test"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "zrdt-core"
path = "core"

[[lean_lib]]
name = "Crdt"

[[lean_lib]]
name = "Test"
globs = ["Test.+"]

# `lake exe axiom_check` prints "axiom gate passed" (the gate itself ran when Test.Axioms was
# built); slow the first time, as it links Mathlib's C.
[[lean_exe]]
name = "axiom_check"
root = "Test.Axioms"

# The challenge for `lake comparator` (comparator.json): the advertised statements with `sorry`
# proofs. Not a default target: `lake build` and `lake check` never build it.
[[lean_lib]]
name = "Comparator"
globs = ["Comparator.+"]
